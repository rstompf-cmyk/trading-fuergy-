name: CI

# Spúšťa pytest na všetky test súbory + syntax check kľúčových modulov.
# Beží na: push do refactor-v2/dev/main + každý PR na tieto branche.

on:
  push:
    branches: [main, dev, refactor-v2]
  pull_request:
    branches: [main, dev, refactor-v2]

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Minimal deps pre testy (žiadny FastAPI/uvicorn potrebný)
          pip install pydantic>=2.0 numpy pandas scipy

      - name: Syntax check (py_compile)
        run: |
          python -m py_compile \
            core/schemas/profile.py \
            core/schemas/plan.py \
            core/schemas/vdt.py \
            core/audit_log.py \
            tools/audit_profile.py \
            tools/sanity_check.py \
            tools/reset_profile_sim.py \
            profiles.py \
            plan_store.py \
            optimizer.py

      - name: Run Pydantic schema tests
        run: |
          python -m tests.test_schema_profile
          python -m tests.test_schema_plan
          python -m tests.test_schema_vdt

      - name: Run golden tests (optimizer regression)
        run: python -m tests.test_golden_optimizer

      - name: Summary
        if: always()
        run: |
          echo "━━━ CI summary ━━━"
          echo "Schema tests: 7 + 14 + 12 = 33 expected"
          echo "Golden tests: 5 expected"
          echo "All passed if no FAIL above."
