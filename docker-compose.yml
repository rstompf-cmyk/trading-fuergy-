# Trading Fuergy â€” Docker Compose pre Windows produkciu
#
# PouĹľitie:
#   docker compose up -d           # spustĂ­ v pozadĂ­
#   docker compose logs -f         # sleduje logy
#   docker compose down            # zastavĂ­ + odstrĂˇni container (dĂˇta v ./data zostanĂş)
#   docker compose pull && docker compose up -d --build   # update po git pull
#
# PerzistentnĂ© dĂˇta sĂş v ./data/ na hostiteÄľovi â€” backupy treba robiĹĄ tam.
# Network mode: bridge (default) â€” container mĂˇ prĂ­stup k host LAN cez NAT.
# Bender (10.200.136.21) + historian (192.168.34.31) sĂş dostupnĂ© rovnako ako z hostiteÄľa.

services:
  trading-fuergy:
    build:
      context: .
      dockerfile: Dockerfile
    image: trading-fuergy:latest
    container_name: trading-fuergy
    restart: unless-stopped

    # Port mapping â€” host:container. Zmena hostiteÄľskĂ©ho portu v .env (DOCKER_PORT).
    ports:
      - "${DOCKER_PORT:-8000}:8000"

    # Bind mounty â€” vĹˇetky dĂˇta na hostiteÄľovi, container je stateless.
    # Pri update appky (git pull + rebuild) sa DB, plĂˇny, profily neztratia.
    volumes:
      # SQLite databĂˇza (auth users, profily, plĂˇny, vdt trades, audit log)
      - ./data/db:/app/db/data
      # VĂ˝stupnĂ© dĂˇta: livesim CSV, plan_store, plan_overrides, load_profile,
      # ftv_scenarios, vdt_paper_trades, auto_control_log, realio_db.sqlite,
      # cache (OTE, PVF), historian CSV
      - ./data/out:/app/out
      # OKTE mTLS certifikĂˇty (pre SOAP IdmOrderBook)
      - ./data/okte_credentials:/app/okte_credentials
      # Cookies pre Bender / SEPS / historian (auto-refresh cez Playwright)
      - ./data/realio_cookies.json:/app/realio_cookies.json
      - ./data/seps_cookies.json:/app/seps_cookies.json
      - ./data/historian_cookies.json:/app/historian_cookies.json

    # Credentials a config sa naÄŤĂ­tajĂş z .env (vedÄľa docker-compose.yml).
    env_file:
      - ./.env

    # DefaultnĂ© env vars â€” mĂ´Ĺľu byĹĄ prepĂ­sanĂ© v .env
    environment:
      # Timezone â€” bez toho container beĹľĂ­ v UTC a vĹˇetky timestampy/grafy
      # sĂş posunutĂ© o 1-2h voÄŤi lokĂˇlnemu ÄŤasu Windows hosta.
      TZ: "Europe/Bratislava"
      USE_DB: "1"
      AUTH_REQUIRED: "1"
      APP_HOST: "0.0.0.0"
      APP_PORT: "8000"
      # PORT â€” pouĹľĂ­va core/state.py pre per-port state isolation
      PORT: "8000"
      # Fáza B.1: sandbox layout — per-profile súbory v out/profiles/<name>/
      FTV_SANDBOX: "1"
      # RT-PRIORITY (2026-06-13): RT povel preváži plán (audit jediná brzda) — dev_budget
      # strop neobmedzuje RT odchýlku. Test na prode. Vypnúť = "0" alebo riadok zmazať.
      RT_OVERRIDES_PLAN: "1"
      # VypnĂşĹĄ background Ăşlohy pri prvom spustenĂ­ (kĂ˝m neoverĂ­Ĺˇ Ĺľe appka beĹľĂ­)
      # Po prvom ĂşspeĹˇnom Ĺˇtarte odkomentuj na produkÄŤnĂ© fungovanie:
      # NO_BACKFILL: "1"

    # Health check â€” Docker bude sledovaĹĄ Ĺľe /me odpovedĂˇ
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8000/me"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

    # Logging limity (aby logy nezaplnili disk)
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"

  # ===========================================================================
  # DEV environment â€” paralelne s prod, port 8001, samostatne data-dev/
  # ---------------------------------------------------------------------------
  # Zdielany image build, ale samostatne data + DB. Pri vyvoji:
  #   git checkout dev
  #   git pull
  #   docker compose up -d --build trading-fuergy-dev
  # Prod bezi nedotknuty. Po overeni dev -> merge do refactor-v2 -> rebuild prod.
  # ===========================================================================
  trading-fuergy-dev:
    build:
      context: .
      dockerfile: Dockerfile
    image: trading-fuergy:dev
    container_name: trading-fuergy-dev
    restart: unless-stopped

    ports:
      - "${DEV_PORT:-8001}:8000"

    # Samostatne bind mounty â€” dev DB/plany/cookies nezdielaju s prod
    volumes:
      - ./data-dev/db:/app/db/data
      - ./data-dev/out:/app/out
      - ./data-dev/okte_credentials:/app/okte_credentials
      - ./data-dev/realio_cookies.json:/app/realio_cookies.json
      - ./data-dev/seps_cookies.json:/app/seps_cookies.json
      - ./data-dev/historian_cookies.json:/app/historian_cookies.json
      # Dev only â€” mount tests/ & tools/ ako read-only z hostiteÄľa.
      # V .dockerignore sĂş vylĂşÄŤenĂ© pre prod image (zbytoÄŤnĂˇ veÄľkosĹĄ),
      # ale v dev ich potrebujeme spustiĹĄ (pytest, smoke tests, CLI tools).
      # Ĺ˝iadny rebuild netreba â€” git pull staÄŤĂ­, mount sleduje host disk.
      - ./tests:/app/tests:ro
      - ./tools:/app/tools:ro
      # core/ bind mount â€” aby zmeny v core/paths.py, core/schemas/, core/audit_log.py
      # neboli vĹľdy potrebnĂ© rebuildovaĹĄ. Read-only â€” Ĺľiadne modifikĂˇcie z containeru.
      - ./core:/app/core:ro

    env_file:
      - ./.env

    environment:
      TZ: "Europe/Bratislava"
      USE_DB: "1"
      AUTH_REQUIRED: "1"
      APP_HOST: "0.0.0.0"
      APP_PORT: "8000"
      PORT: "8000"
      # Dev flag pre prip. UI banner ze ide o dev (appka moze citat ENV=dev)
      ENV: "dev"
      # Krok 0 merania (2026-06-14): zapne [ADVANCE-TIMING] summary log v livesim.advance
      # (total/minload/loop/io/effectdb). LEN na deve 8001 - prod 8000 ho nema = nulovy dopad.
      LIVESIM_TIMING: "1"
      # Diagnostika (2026-06-14): cProfile slučky pri pomalých behoch (>5s) — hľadáme prečo
      # je VW per-deň 25,5s. Po zistení vypnúť (="0"). Len dev 8001.
      LIVESIM_PROFILE: "1"
      # Uloha #7 BG-ALL-PROFILES: VYPNUTE (0). bg-all kazdy tick prepisoval meta neaktivnych
      # profilov -> render-cache padla -> navrat na profil = prepocet (presne to co nechceme).
      # So zmrazenou metou neaktivneho profilu sedi mtime -> cache hit = okamzity navrat.
      # Aktivny profil drzi teply normalny bg + cache_store. (kod ostava, len gated off)
      LIVESIM_BG_ALL: "0"

    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8000/me"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"

    # Default: dev sa nestartuje automaticky pri `docker compose up`
    # Spustenie len: `docker compose up -d trading-fuergy-dev`
    profiles:
      - dev
